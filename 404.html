<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07111f">
  <link rel="stylesheet" href="/assets/css/global.css">
  <title>404 | Rubén Cañizares</title>
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:32px}.error-card{width:min(760px,100%);padding:48px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow)}.error-code{margin:0;color:var(--accent);font-size:.8rem;font-weight:900;letter-spacing:.18em}.error-card h1{margin:14px 0;font-size:clamp(2.5rem,7vw,5.4rem);line-height:.95;letter-spacing:-.055em}.error-card p{max-width:580px;color:var(--text-soft);font-size:1.05rem}.error-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <p class="error-code">ERROR 404</p>
      <h1>Página no encontrada.</h1>
      <p>La dirección que intentaste abrir no existe o todavía no forma parte del portal profesional.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">Volver al inicio</a>
        <a class="btn btn-secondary" href="/#profiles">Ver perfiles profesionales</a>
      </div>
    </section>
  </main>
</body>
</html>
