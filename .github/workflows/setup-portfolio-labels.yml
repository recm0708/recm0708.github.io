name: Setup portfolio labels

on:
  push:
    paths:
      - ".github/workflows/setup-portfolio-labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update portfolio labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          upsert_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            local encoded
            encoded="$(jq -rn --arg v "$name" '$v|@uri')"

            if gh api "repos/$GH_REPO/labels/$encoded" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/labels/$encoded" \
                -f new_name="$name" \
                -f color="$color" \
                -f description="$description" >/dev/null
            else
              gh api --method POST "repos/$GH_REPO/labels" \
                -f name="$name" \
                -f color="$color" \
                -f description="$description" >/dev/null
            fi
          }

          upsert_label "area:portada" "6f42c1" "Portada, hero, navegación y contenido visual principal."
          upsert_label "area:cv" "0969da" "Auditoría y contenido de los currículos."
          upsert_label "area:contenido" "0e8a16" "Historia, logros, intereses y textos personales."
          upsert_label "area:documentacion" "8250df" "Certificados, credenciales, fotos fuente y archivos de respaldo."
          upsert_label "area:diseno" "bf8700" "SVG, iconografía, favicon, social preview y recursos visuales."
          upsert_label "area:repositorio" "5319e7" "README, About, Topics, Pages y configuración del repositorio."
          upsert_label "area:qa" "fbca04" "Pruebas, accesibilidad, responsive y publicación final."
          upsert_label "area:git" "b60205" "Historial, consolidación y limpieza Git."
          upsert_label "blocked" "d73a4a" "Dependencia externa que impide continuar."
